name: Free Games

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free-games
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python free_games.py
        env:
          DISCORD_FREEGAMES_WEBHOOK_URL: ${{ secrets.DISCORD_FREEGAMES_WEBHOOK_URL }}

      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add free_games_seen.json
          git diff --cached --quiet || (git commit -m "Update free games state" && git pull --rebase && git push)
