name: Update NFL Scores

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-scores
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python nfl_scores.py
        env:
          DISCORD_NFL_WEBHOOK_URL: ${{ secrets.DISCORD_NFL_WEBHOOK_URL }}

      - name: Save state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add nfl_message_id.txt nfl_state.json
          git diff --cached --quiet || (git commit -m "Update NFL state" && git pull --rebase && git push)
